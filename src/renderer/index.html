<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>Ready - 自媒体 AI 工作台</title>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'nonce-cmVhZHktd2lkZ2V0' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file: local-file:; media-src 'self' file: local-file: https:; object-src 'self' local-file:; frame-src 'self' blob: local-file: https://www.youtube.com https://www.youtube-nocookie.com; font-src 'self'; connect-src 'self' https:;" />
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var opt = localStorage.getItem('ready-theme');
        if (opt !== 'dark' && opt !== 'light' && opt !== 'system') opt = 'light';
        var resolved = opt === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : opt;
        var skin = localStorage.getItem('ready-theme-skin');
        if (skin !== 'liquid-glass') skin = 'liquid-glass';
        root.setAttribute('data-theme', resolved);
        root.setAttribute('data-skin', skin);
      } catch (_) {
        root.setAttribute('data-theme', 'light');
        root.setAttribute('data-skin', 'liquid-glass');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>

</html>
