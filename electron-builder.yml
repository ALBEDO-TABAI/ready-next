appId: com.ready.app
productName: Ready
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - node_modules/**/*
extraResources:
  - from: build/runtime-seeds/ai-settings.seed.json
    to: ai-settings.seed.json
  - from: node_modules/better-sqlite3/build
    to: better-sqlite3/build
    filter:
      - "**/*"
  - from: assets/embedded-skills
    to: embedded-skills
    filter:
      - "**/*"
  - from: src/main/modules/rss-engine/rsshub-worker.mjs
    to: rsshub-worker.mjs
  - from: src/python
    to: sidecar
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: dir
      arch:
        - arm64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
npmRebuild: true
nodeGypRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
asar: true
asarUnpack:
  - "node_modules/rsshub/**"
  - "node_modules/better-sqlite3/**"
