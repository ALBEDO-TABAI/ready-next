appId: com.ready.app.next
productName: Ready Next
directories:
  buildResources: build
  output: exports
publish:
  provider: github
  owner: ALBEDO-TABAI
  repo: ready-releases
  releaseType: release
files:
  - out/**/*
  - build/browser-live-proof/source-manifest.json
  - build/browser-live-proof/release-build.json
  - package.json
  - node_modules/**/*
  # Renderer-only packages are already bundled into out/renderer assets by Vite.
  # Keep main-process runtime deps in node_modules; only exclude packages that
  # src/main and src/preload never import dynamically.
  - "!node_modules/@mermaid-js/**"
  - "!node_modules/@napi-rs/canvas"
  - "!node_modules/@napi-rs/canvas/**"
  - "!node_modules/**/@napi-rs/canvas-darwin-arm64"
  - "!node_modules/**/@napi-rs/canvas-darwin-arm64/**"
  - "!node_modules/@remotion/**"
  - "!node_modules/@schedule-x/**"
  - "!node_modules/@tiptap/**"
  - "!node_modules/@univerjs/**"
  - "!node_modules/@univerjs-pro/**"
  - "!node_modules/artplayer/**"
  - "!node_modules/foliate-js/**"
  - "!node_modules/framer-motion/**"
  - "!node_modules/liquid-glass-react/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/mediabunny/**"
  - "!node_modules/mermaid/**"
  - "!node_modules/motion-dom/**"
  - "!node_modules/motion-utils/**"
  - "!node_modules/pdfjs-dist/**"
  - "!node_modules/photoswipe/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/react-pdf/**"
  - "!node_modules/remotion/**"
  - "!node_modules/**/build/node_gyp_bins/**"
  - "!node_modules/**/.npmrc*"
  - "!node_modules/**/docs/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/test/**"
  - "!node_modules/**/tests/**"
  - "!node_modules/**/__tests__/**"
  - "!node_modules/**/src/**/test/**"
  - "!node_modules/**/src/**/tests/**"
extraResources:
  - from: build/runtime-seeds/ai-settings.seed.json
    to: ai-settings.seed.json
  - from: assets/codex-runtime
    to: codex-runtime
    filter:
      - "**/*"
      - "!evidence/**"
  - from: assets/runtime-continuity
    to: runtime-continuity
    filter:
      - "**/*"
  - from: build/codex/aarch64-apple-darwin/codex
    to: codex-runtime/aarch64-apple-darwin/codex
  - from: node_modules/better-sqlite3/build
    to: better-sqlite3/build
    filter:
      - "**/*"
      - "!node_gyp_bins/**"
  - from: assets/embedded-skills
    to: embedded-skills
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.py[co]"
      - "!**/.env"
      - "!**/.env.*"
  - from: assets/pets
    to: pets
    filter:
      - "**/*"
  - from: assets/board
    to: board
    filter:
      - "**/*"
  - from: assets/prompts
    to: prompts
    filter:
      - "**/*"
  - from: assets/site-cards
    to: site-cards
    filter:
      - "**/*"
  - from: src/main/modules/rss-engine/rsshub-worker.mjs
    to: rsshub-worker.mjs
  - from: src/python
    to: sidecar
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.py[co]"
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
    - target: dir
      arch:
        - arm64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
afterPack: scripts/post-build.cjs
# Binds every produced DMG to the exact source tree it was built from.
afterAllArtifactBuild: scripts/write-release-receipt.cjs
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
npmRebuild: true
nodeGypRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
asar: true
asarUnpack:
  - "node_modules/rsshub/**"
  - "node_modules/better-sqlite3/**"

protocols:
  - name: Ready Next Calendar
    schemes:
      - ready-next
fileAssociations:
  - ext:
      - ics
      - vcs
    name: iCalendar
    role: Viewer
