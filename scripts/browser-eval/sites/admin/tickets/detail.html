<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Eval · {{id}}</title>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/eval-probe.js" defer>
</script>
</head>
<body>
<main>
<h1>{{id}} {{subject}}</h1>
<p>{{content}}</p>
<form method="post" action="{{path}}" >
<label for="reply">回复</label>
<textarea id="reply" name="reply">{{reply}}</textarea>
<label for="ticket-status">状态</label>
<select id="ticket-status" name="status">
<option value="待处理" {{pending}}>待处理</option>
<option value="处理中" {{processing}}>处理中</option>
<option value="已解决" {{resolved}}>已解决</option>
</select>
<label for="ticket-assignee">分配给</label>
<select id="ticket-assignee" name="assignee">
<option value="" {{unassigned}}>空</option>
<option value="客服" {{support}}>客服</option>
<option value="财务" {{finance}}>财务</option>
<option value="技术" {{technical}}>技术</option>
</select>
<button type="submit">保存</button>
</form>
</main>
</body>
</html>
