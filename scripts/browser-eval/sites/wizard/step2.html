<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Eval · 配送订单</title>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/eval-probe.js" defer>
</script>
</head>
<body>
<main>
<h1>第 2 步：配送</h1>{{error}}<form method="post" action="/wizard/step3" >
<input type="hidden" name="token" value="{{token}}">
<label for="w-city">城市</label>
<select id="w-city" name="city">
<option value="上海" {{city0}}>上海</option>
<option value="北京" {{city1}}>北京</option>
<option value="杭州" {{city2}}>杭州</option>
</select>
<label for="w-address">地址</label>
<input id="w-address" name="address" type="text" value="{{address}}" >
<label for="w-slot">时段</label>
<select id="w-slot" name="slot">
<option value="上午" {{slot0}}>上午</option>
<option value="下午" {{slot1}}>下午</option>
<option value="晚上" {{slot2}}>晚上</option>
</select>
<button type="submit">下一步</button>
</form>
</main>
</body>
</html>
