<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Eval · 联系我们</title>
<link rel="stylesheet" href="/assets/site.css">
<script src="/assets/eval-probe.js" defer>
</script>
</head>
<body>
<main>
<h1>联系我们</h1>
<form method="post" action="/form/submit" id="contact-form">
<label for="name">姓名</label>
<input id="name" name="name" type="text" value="" required>
<label for="email">邮箱</label>
<input id="email" name="email" type="email" value="" required>
<label for="topic">主题</label>
<select id="topic" name="topic">
<option value="" selected>请选择</option>
<option value="sales" >购买咨询</option>
<option value="support" >技术支持</option>
<option value="other" >其他</option>
</select>
<label for="message">留言</label>
<textarea id="message" name="message">
</textarea>
<input id="subscribe" name="subscribe" type="checkbox" value="yes" >
<label for="subscribe">订阅月报</label>
<button type="submit">提交</button>
</form>
</main>
</body>
</html>
