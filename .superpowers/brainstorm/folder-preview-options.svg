<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#F3F4F7"/>
  <text x="80" y="88" fill="#1F2937" font-size="34" font-family="Arial, PingFang SC, sans-serif" font-weight="700">文件夹缩略图优化方向</text>
  <text x="80" y="126" fill="#6B7280" font-size="18" font-family="Arial, PingFang SC, sans-serif">目标：没有图片时，卡片更安静、更好扫读，不再被一堆小文件夹图标打断。</text>

  <g transform="translate(70 170)">
    <rect width="390" height="620" rx="28" fill="#FFFFFF" stroke="#D7DCE5"/>
    <text x="28" y="44" fill="#111827" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">A 只去掉子文件夹图标</text>
    <text x="28" y="74" fill="#6B7280" font-size="15" font-family="Arial, PingFang SC, sans-serif">文件继续带图标，文件夹只留名字</text>

    <rect x="28" y="108" width="334" height="244" rx="20" fill="#EEF1F7" stroke="#D7DCE5"/>
    <rect x="46" y="126" width="143" height="102" rx="12" fill="#FFF7E8" stroke="#E8D7AE"/>
    <text x="59" y="152" fill="#D09A29" font-size="18" font-family="Arial, PingFang SC, sans-serif">templates</text>
    <rect x="200" y="126" width="143" height="102" rx="12" fill="#F4F7FC" stroke="#D9E0EC"/>
    <text x="254" y="169" fill="#5B6578" font-size="28" font-family="Arial, sans-serif">⎘</text>
    <text x="220" y="209" fill="#5B6578" font-size="18" font-family="Arial, PingFang SC, sans-serif">chat.md</text>
    <rect x="46" y="238" width="143" height="96" rx="12" fill="#FFF7E8" stroke="#E8D7AE"/>
    <text x="86" y="292" fill="#D09A29" font-size="18" font-family="Arial, PingFang SC, sans-serif">skills</text>
    <rect x="200" y="238" width="143" height="96" rx="12" fill="#F4F7FC" stroke="#D9E0EC"/>
    <text x="254" y="279" fill="#5B6578" font-size="28" font-family="Arial, sans-serif">⎘</text>
    <text x="232" y="316" fill="#5B6578" font-size="18" font-family="Arial, PingFang SC, sans-serif">notes</text>

    <text x="28" y="410" fill="#374151" font-size="18" font-family="Arial, PingFang SC, sans-serif" font-weight="700">感觉</text>
    <text x="28" y="442" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">优点：改动最小，文件和文件夹还能区分。</text>
    <text x="28" y="474" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">问题：画面里还是会保留不少小图标，</text>
    <text x="28" y="500" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">安静感提升有限。</text>
  </g>

  <g transform="translate(505 150)">
    <rect width="390" height="660" rx="32" fill="#FFFFFF" stroke="#88A6E8" stroke-width="2.5"/>
    <rect x="20" y="20" width="98" height="34" rx="17" fill="#E8F0FF"/>
    <text x="49" y="42" fill="#3B82F6" font-size="15" font-family="Arial, PingFang SC, sans-serif" font-weight="700">推荐</text>
    <text x="28" y="84" fill="#111827" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">B 无图片时统一只留名字</text>
    <text x="28" y="114" fill="#6B7280" font-size="15" font-family="Arial, PingFang SC, sans-serif">有图片才显示图；其余内容都用安静的文字砖块</text>

    <rect x="28" y="148" width="334" height="268" rx="22" fill="#EEF1F7" stroke="#D7DCE5"/>
    <rect x="46" y="166" width="143" height="102" rx="14" fill="#FFF8EB" stroke="#E8D7AE"/>
    <text x="78" y="223" fill="#AD7C19" font-size="19" font-family="Arial, PingFang SC, sans-serif">templates</text>
    <rect x="200" y="166" width="143" height="102" rx="14" fill="#F7F8FB" stroke="#DCE2EC"/>
    <text x="236" y="223" fill="#4B5563" font-size="19" font-family="Arial, PingFang SC, sans-serif">chat.md</text>
    <rect x="46" y="278" width="143" height="120" rx="14" fill="#FFF8EB" stroke="#E8D7AE"/>
    <text x="98" y="343" fill="#AD7C19" font-size="19" font-family="Arial, PingFang SC, sans-serif">skills</text>
    <rect x="200" y="278" width="143" height="120" rx="14" fill="#F7F8FB" stroke="#DCE2EC"/>
    <text x="248" y="343" fill="#4B5563" font-size="19" font-family="Arial, PingFang SC, sans-serif">notes</text>

    <text x="28" y="474" fill="#374151" font-size="18" font-family="Arial, PingFang SC, sans-serif" font-weight="700">感觉</text>
    <text x="28" y="506" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">优点：最干净，扫一眼更快，层次更统一。</text>
    <text x="28" y="538" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">区分方式改成靠底色和排版，不靠图标堆叠。</text>
    <text x="28" y="570" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">代价：文件类型提示会比现在弱一点。</text>
  </g>

  <g transform="translate(940 170)">
    <rect width="390" height="620" rx="28" fill="#FFFFFF" stroke="#D7DCE5"/>
    <text x="28" y="44" fill="#111827" font-size="24" font-family="Arial, PingFang SC, sans-serif" font-weight="700">C 更紧凑的标签式</text>
    <text x="28" y="74" fill="#6B7280" font-size="15" font-family="Arial, PingFang SC, sans-serif">像便签一样堆叠，信息密度更高</text>

    <rect x="28" y="108" width="334" height="244" rx="20" fill="#EEF1F7" stroke="#D7DCE5"/>
    <rect x="46" y="126" width="143" height="64" rx="14" fill="#FFF8EB" stroke="#E8D7AE"/>
    <text x="61" y="165" fill="#AD7C19" font-size="18" font-family="Arial, PingFang SC, sans-serif">templates</text>
    <rect x="200" y="126" width="143" height="64" rx="14" fill="#F7F8FB" stroke="#DCE2EC"/>
    <text x="231" y="165" fill="#4B5563" font-size="18" font-family="Arial, PingFang SC, sans-serif">chat.md</text>
    <rect x="46" y="200" width="143" height="64" rx="14" fill="#FFF8EB" stroke="#E8D7AE"/>
    <text x="89" y="239" fill="#AD7C19" font-size="18" font-family="Arial, PingFang SC, sans-serif">skills</text>
    <rect x="200" y="200" width="143" height="64" rx="14" fill="#F7F8FB" stroke="#DCE2EC"/>
    <text x="244" y="239" fill="#4B5563" font-size="18" font-family="Arial, PingFang SC, sans-serif">notes</text>
    <rect x="46" y="274" width="143" height="64" rx="14" fill="#F7F8FB" stroke="#DCE2EC"/>
    <text x="91" y="313" fill="#4B5563" font-size="18" font-family="Arial, PingFang SC, sans-serif">rules</text>

    <text x="28" y="410" fill="#374151" font-size="18" font-family="Arial, PingFang SC, sans-serif" font-weight="700">感觉</text>
    <text x="28" y="442" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">优点：信息量最大，名字能放得更完整。</text>
    <text x="28" y="474" fill="#6B7280" font-size="16" font-family="Arial, PingFang SC, sans-serif">问题：卡片会更像标签墙，缩略图感会弱。</text>
  </g>
</svg>
