name: Ready Windows packaged smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - windows
      - 'codex/**'
  pull_request:
    branches:
      - main
      - windows

concurrency:
  group: ready-windows-packaged-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-packaged-smoke:
    name: windows-packaged-smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup Python for native rebuild
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Prepare pinned Windows runtime and empty test seed
        shell: pwsh
        run: |
          $lock = Get-Content assets/codex-runtime/source-lock.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $lock.releaseAsset.name
          Invoke-WebRequest $lock.releaseAsset.url -OutFile $archive
          node scripts/codex-runtime/prepare-pinned-runtime.cjs --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/runtime-seeds | Out-Null
          Set-Content build/runtime-seeds/ai-settings.seed.json '{}' -Encoding utf8NoBOM

      - name: Verify Windows Agent startup, recovery and exit authority
        run: npm run verify:codex-runtime-windows

      - name: Build renderer and main process
        run: npm run build

      - name: Generate packaged third-party notices
        run: npm run licenses:generate

      - name: Package Windows app directory
        run: npx electron-builder --config electron-builder.yml --win --dir --publish never

      - name: Run packaged smoke
        run: node scripts/run-packaged-smoke.cjs --platform win32 --port 9335 --timeout 90000 --out test-results/windows-packaged-smoke.json

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-smoke
          path: test-results/windows-packaged-smoke.json
