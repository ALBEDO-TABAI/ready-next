[project]
name = "video-expert-analyzer-vnext"
# 代码使用 PEP 604 联合类型（X | None）等 3.10+ 语法
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.6.9",
    "quickjs>=1.19.4",
    "scenedetect[opencv]>=0.6",
    "ffmpeg-python>=0.2",
    "openai>=1.0",
    "anthropic>=0.20",
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "browser_cookie3>=0.19",
]

[project.optional-dependencies]
# 字幕降级链第 4 级：本地 ASR（体积大，含 torch）
asr = ["funasr>=1.0", "modelscope>=1.9", "torch>=2.0", "mlx-whisper>=0.1"]
# 字幕降级链第 3 级：烧录字幕 OCR
ocr = ["rapidocr-onnxruntime>=1.3"]
full = ["video-expert-analyzer-vnext[asr,ocr]"]
