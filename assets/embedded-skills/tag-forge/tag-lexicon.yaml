# ============ 状态 state（封闭枚举：首轮一律 待整理，流转由用户驱动） ============
  - {id: inbox,     facet: state, label: 待整理, aliases: [inbox, 未读], def: 新入库、未经人工确认的素材, status: active}
  - {id: read,      facet: state, label: 已精读, aliases: [已读, 已消化], def: 已完整阅读并确认 tag 的素材, status: active}
  - {id: curated,   facet: state, label: 精选,   aliases: [收藏, 五星], def: 用户标记的高价值素材, status: active}
  - {id: archived,  facet: state, label: 已归档, aliases: [归档, 过期], def: 保留但不再活跃使用的素材, status: active}
