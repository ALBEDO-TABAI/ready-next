# tag-forge 受控词表（活资产：每轮打标后经用户批复更新并落盘）
# 词条字段：id(英文kebab-case，机器用) / facet / label(展示名，中文优先) /
#          aliases(归一命中面) / def(一句话定义+适用边界) / status(active|pending|deprecated)
# 语言规则：有通行中文名用中文 label；无通行中文名保留官方英文写法

version: 0.1
config:
  prefix_mode: false          # true 时 tag 显示为 #facet/label
  tags_per_doc: [3, 7]        # 每份素材 tag 总数下限/上限
  new_tags_per_run: 10        # 单轮运行新建词条上限
  new_tags_per_doc: 2         # 单份素材新建词条上限
  orphan_review_days: 90      # 孤儿词条观察期

# ============ 形态 form（封闭枚举：不经闸门三新建，扩充需用户显式批准） ============
entries:
  - {id: brand-analysis,   facet: form, label: 品牌分析,  aliases: [品牌拆解, 品牌研究, brand analysis], def: 以单一品牌为主要对象的系统性分析报告, status: active}
  - {id: tutorial,         facet: form, label: 教程,      aliases: [教学, 指南, how-to, guide], def: 以教会读者完成某件事为目的的步骤性内容, status: active}
  - {id: case-study,       facet: form, label: 案例拆解,  aliases: [案例分析, 复盘, case study], def: 对具体项目/作品/事件的过程与得失拆解, status: active}
  - {id: reference-doc,    facet: form, label: 参考资料,  aliases: [文档, 手册, reference], def: 供查阅的事实性/规范性资料（参数表、规范、白皮书）, status: active}
  - {id: prompt-asset,     facet: form, label: 提示词,    aliases: [prompt, 咒语], def: 可复用的 AI 提示词或提示词模板, status: active}
  - {id: inspiration,      facet: form, label: 灵感采集,  aliases: [参考图, 灵感, moodboard, 收藏], def: 以视觉/创意参考为目的收集的图文素材, status: active}
  - {id: meeting-notes,    facet: form, label: 会议记录,  aliases: [会议纪要, 访谈记录], def: 会议/访谈/沟通的过程记录, status: active}
  - {id: contract,         facet: form, label: 合同,      aliases: [协议, 契约, contract], def: 具有法律效力的协议类文档, status: active}
  - {id: dataset,          facet: form, label: 数据集,    aliases: [数据表, data], def: 以结构化数据为主体的素材, status: active}
  - {id: essay,            facet: form, label: 随笔观点,  aliases: [杂谈, 评论, 观点文], def: 以表达观点/思考为主的非结构化文章, status: active}

