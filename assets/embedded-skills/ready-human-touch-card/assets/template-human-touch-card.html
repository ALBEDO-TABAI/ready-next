<!DOCTYPE html>
<html lang="zh-CN" data-style="human-touch">
<head>
<meta charset="UTF-8">
<title>[必填] 任务名 · Human Touch Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ================================================================
   风格 H · Human Touch 温感人文 —— 社交信息卡种子（1080px 尺度）
   直角 · 无阴影 · 明体标题 · 蛋壳白/白色带 · 琥珀点图
   ================================================================ */

/* ==== 1. 设计令牌 ==== */
:root{
  --paper:#F4F3ED; --card:#FFFFFF; --inset:#FAF9F5;
  --ink:#141414; --ink-body:#141414; --ink-2:#6B6B6B; --ink-3:#A8A8A8;
  --hair:#E0DFD9;
  --red:#EF3E08; --red-soft:#FDEBE4;
  --amber:#C85B1E; --amber-deep:#9C4323; --amber-bright:#E48421; --amber-soft:#FDF0E4; --cream:#FAE8B1;
  --ok:#2D6A4F;
  --dc-on:#C85B1E; --dc-off:#CDC8BC; --dc-rest:#E7E3D8;
  --serif:"ShuiMu MingTi","水木明体","Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Founder YouHei","方正悠黑","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

/* ==== 2. 摄影台 ==== */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1E1D1A;font-family:var(--sans);color:var(--ink-body);padding:64px 32px;-webkit-font-smoothing:antialiased}
.sheet{display:flex;flex-direction:column;align-items:center;gap:48px}
img{display:block;max-width:100%}
figure{margin:0}

/* ==== 3. 画板 ==== */
.poster{position:relative;background:var(--paper);color:var(--ink-body);overflow:hidden;isolation:isolate}
.poster.xhs{width:1080px;height:1440px}
.poster.square{width:1080px;height:1080px}
.poster.wide{width:2100px;height:900px}
.poster.white{background:var(--card)}
.poster.dark{
  background:#141414;color:#F4F3ED;
  --ink:#F4F3ED;--ink-body:#F4F3ED;--ink-2:#A8A8A8;--ink-3:#7C7C78;
  --card:#1F1F1F;--inset:#1B1B1A;--hair:rgba(244,243,237,.16);
  --dc-off:#4A4844;--dc-rest:#2A2927;
}
.poster.amber{
  background:linear-gradient(135deg,#9C4323 0%,#E48421 100%);color:#FFF6EA;
  --ink:#FFF6EA;--ink-body:#FFF6EA;--ink-2:rgba(255,246,234,.78);--ink-3:rgba(255,246,234,.55);
  --hair:rgba(255,246,234,.28);
  --dc-on:#FFF6EA;--dc-off:rgba(255,246,234,.4);--dc-rest:rgba(255,246,234,.18);
}
.content{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column}
.poster.xhs .content{padding:96px 88px}
.poster.square .content{padding:88px}
.poster.wide .content{padding:88px 120px}
/* 纸纹（静态、极淡；仪式卡 opt-in） */
.poster.grain::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='7'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='1'/></svg>");
  background-size:200px 200px;
}

/* ==== 4. 页眉 / 页脚 ==== */
.chrome{display:flex;justify-content:space-between;align-items:baseline;
  font-size:21px;letter-spacing:.08em;color:var(--ink-2);font-weight:500;margin-bottom:60px}
.foot{margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;align-items:center;
  font-size:20px;letter-spacing:.06em;color:var(--ink-3)}
.foot .mark{font-family:var(--serif);letter-spacing:.12em;color:var(--ink-2)}

/* ==== 5. 排版（明体的温度 × 悠黑的清晰；正文 ≥28 红线） ==== */
.h-display{font-family:var(--serif);font-size:100px;font-weight:400;letter-spacing:.04em;line-height:1.24;color:var(--ink)}
.h-display-sm{font-family:var(--serif);font-size:76px;font-weight:400;letter-spacing:.04em;line-height:1.3;color:var(--ink)}
.h-xl{font-family:var(--serif);font-size:56px;font-weight:400;letter-spacing:.03em;line-height:1.42;color:var(--ink)}
.h-md{font-size:40px;font-weight:500;letter-spacing:.01em;line-height:1.4;color:var(--ink)}
.h-sub{font-size:31px;font-weight:500;color:var(--ink)}
.lead{font-size:34px;font-weight:400;line-height:1.75;color:var(--ink-body)}
.body{font-size:30px;line-height:1.75;color:var(--ink-body)}
.body-sm{font-size:25px;line-height:1.7;color:var(--ink-2)}
.kicker{font-size:22px;font-weight:500;letter-spacing:.14em;color:var(--amber)}
.kicker.red{color:var(--red)}
.t-meta{font-size:20px;color:var(--ink-3);letter-spacing:.05em}
.stat-num{font-weight:300;font-size:150px;line-height:1.05;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-num .stat-unit{font-size:.3em;font-weight:400;color:var(--ink-2);letter-spacing:.02em}
.serif{font-family:var(--serif)}
.amber-text{color:var(--amber)}
.red-text{color:var(--red)}
.v-kicker{writing-mode:vertical-rl;font-family:var(--serif);font-size:26px;letter-spacing:.32em;color:var(--ink-2);
  border-left:1px solid var(--hair);padding-left:22px}

/* ==== 6. 结构件（直角、平面、1px 边） ==== */
.card{background:var(--card);border:1px solid var(--hair);padding:44px 48px}
.card-inset{background:var(--inset);border:1px solid var(--hair);padding:40px 44px}
.rule{height:1px;background:var(--hair);border:0}
.rule-strong{height:1px;background:var(--ink);border:0}
.rule-amber{height:3px;background:var(--amber);border:0;width:84px}
.ing-tag{display:inline-block;border:1px solid var(--ink);padding:12px 28px;font-size:24px;color:var(--ink);background:var(--card);font-weight:400}
.label{display:inline-block;background:var(--amber-soft);color:var(--amber);padding:10px 22px;font-size:21px;font-weight:500}
.label.red{background:var(--red-soft);color:var(--red)}
.label.plain{background:var(--paper);color:var(--ink);border:1px solid var(--hair)}
.ledger{display:flex;flex-direction:column}
.ledger-row{display:grid;grid-template-columns:auto 1fr auto;gap:32px;align-items:baseline;padding:34px 0;border-bottom:1px solid var(--hair)}
.ledger-row:first-child{border-top:1px solid var(--hair)}
.ledger-no{font-family:var(--serif);font-size:26px;color:var(--ink-3)}
.ledger-title{font-family:var(--serif);font-size:40px;color:var(--ink);letter-spacing:.02em}
.ledger-desc{font-size:25px;color:var(--ink-2);line-height:1.65;margin-top:8px;font-family:var(--sans)}
.ledger-meta{font-size:22px;color:var(--ink-2);text-align:right}
.steps-v{display:flex;flex-direction:column}
.step-row{display:grid;grid-template-columns:96px 1fr;gap:32px;padding:38px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.step-row:first-child{border-top:1px solid var(--hair)}
.step-no{font-family:var(--serif);font-size:44px;color:var(--amber)}
.step-title{font-family:var(--serif);font-size:38px;color:var(--ink)}
.step-desc{font-size:25px;color:var(--ink-2);line-height:1.65;margin-top:8px}
.stack{display:flex;flex-direction:column}
.cols{display:flex}
.gap-2{gap:12px}.gap-3{gap:16px}.gap-4{gap:24px}.gap-5{gap:32px}.gap-6{gap:44px}.gap-7{gap:60px}.gap-8{gap:80px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}

/* ==== 7. 点阵图表（琥珀、安静） ==== */
.dot-chart{--dc-dot:18px;--dc-gap:8px}
.dot-chart .dc-dot{width:var(--dc-dot);height:var(--dc-dot);border-radius:50%;flex:none}
.dot-chart .dc-dot.on{background:var(--dc-on)}
.dot-chart .dc-dot.off{background:var(--dc-off)}
.dot-chart .dc-dot.rest{background:var(--dc-rest)}
.dot-chart .dc-val{font-weight:300;font-size:32px;color:var(--ink);font-variant-numeric:tabular-nums}
.dot-chart .dc-lab{font-size:24px;color:var(--ink-2)}
.dot-chart .dc-legend{font-size:21px;color:var(--ink-3);margin-top:24px}
.dot-chart .dc-legend .dc-dot{display:inline-block;vertical-align:-2px;margin-right:8px}
.dc-bar-wrap{display:flex;align-items:flex-end;gap:calc(var(--dc-dot)*2)}
.dc-bar-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.dc-bar-dots{display:flex;flex-direction:column-reverse;gap:var(--dc-gap)}
.dc-hbar-row{display:grid;grid-template-columns:minmax(130px,auto) 1fr auto;gap:28px;align-items:center;padding:18px 0}
.dc-hbar-dots{display:flex;gap:var(--dc-gap)}
.dc-waffle{display:grid;grid-template-columns:repeat(10,var(--dc-dot));gap:var(--dc-gap)}
.dc-line svg{display:block;overflow:visible}
.dc-line .dc-path{fill:none;stroke:var(--dc-on);stroke-width:3px;stroke-linejoin:round;stroke-linecap:round}
.dc-line .dc-grid{stroke:var(--hair);stroke-width:1px}
.dc-line .dc-pt{fill:var(--dc-on);stroke:var(--card);stroke-width:3px}
.dc-line text{font-family:var(--sans)}

/* ==== 8. 图片槽位（直角版） ==== */
.img-slot{position:relative;overflow:hidden;background:var(--inset);width:100%}
.img-slot>img{width:100%;height:100%;object-fit:cover;object-position:center 50%}
.img-slot.fit-contain>img{object-fit:contain}
.img-slot.r-21x9{aspect-ratio:21/9}
.img-slot.r-16x9{aspect-ratio:16/9}
.img-slot.r-16x10{aspect-ratio:16/10}
.img-slot.r-4x3{aspect-ratio:4/3}
.img-slot.r-3x2{aspect-ratio:3/2}
.img-slot.r-1x1{aspect-ratio:1/1}
.img-slot.r-3x4{aspect-ratio:3/4}
.img-slot.is-empty{border:1px solid var(--hair)}
.img-slot.is-empty::before{
  content:attr(data-image-slot);
  position:absolute;left:50%;top:50%;transform:translate(-50%,-70%);
  font-size:24px;font-weight:500;letter-spacing:.06em;color:var(--ink-2);
  background:var(--card);border:1px solid var(--hair);padding:14px 30px;white-space:nowrap;
}
.img-slot.is-empty::after{
  content:attr(data-slot-ratio) "  ·  " attr(data-slot-desc);
  position:absolute;left:50%;top:50%;transform:translate(-50%,110%);
  font-size:20px;color:var(--ink-3);letter-spacing:.05em;white-space:nowrap;
}
.img-cap{font-size:20px;color:var(--ink-2);letter-spacing:.03em;margin-top:18px;line-height:1.6}
.img-cap .cap-serif{font-family:var(--serif);color:var(--ink)}

/* ==== 9. 微信封面对预览（审查用，非交付件） ==== */
.pair-preview{
  width:2400px;min-height:1180px;background:#26241F;padding:48px;
  display:grid;grid-template-columns:2100px 1080px;grid-template-rows:900px 1080px;
  gap:48px;align-content:center;justify-content:center;
}
.pair-preview .preview-wide{grid-column:1;grid-row:1 / span 2;align-self:center}
.pair-preview .preview-square{grid-column:2;grid-row:1 / span 2;align-self:center}
.preview-label{font-size:20px;letter-spacing:.12em;color:#9C968A;margin-bottom:14px}
</style>
</head>
<body>
<div class="sheet">

  <!-- ============ 示例 · HC01 封面卡（3:4，明体 + 竖排引导） ============ -->
  <section class="poster xhs grain" id="xhs-01" data-layout="HC01">
    <div class="content">
      <div class="chrome"><div>[必填] 栏目</div><div>2026.MM</div></div>
      <div class="cols" style="flex:1;gap:64px">
        <div class="stack gap-6" style="flex:1;justify-content:center">
          <hr class="rule-amber">
          <h1 class="h-display">[必填] 封面标题<br>两行以内</h1>
          <p class="lead" style="max-width:720px">[必填] 一句副题：温和地说明这组卡讲什么。</p>
          <div class="cols gap-4">
            <span class="ing-tag">[必填] 关键词</span>
            <span class="ing-tag">[必填] 关键词</span>
          </div>
        </div>
        <div style="display:flex;align-items:center">
          <div class="v-kicker">[必填] 一句引导语</div>
        </div>
      </div>
      <div class="foot"><div class="mark">[必填] 署名</div><div>01 / NN</div></div>
    </div>
  </section>

  <!-- ============ 示例 · 微信封面对（21:9 + 1:1） ============ -->
  <section class="poster wide" id="wechat-21x9" data-layout="HC09">
    <div class="content">
      <div class="chrome"><div>[必填] 公众号名</div><div>2026.MM.DD</div></div>
      <div class="cols" style="flex:1;align-items:center;gap:96px">
        <div class="stack gap-6" style="flex:1.3">
          <div class="kicker">[必填] KICKER</div>
          <h1 class="h-display" style="font-size:108px">[必填] 主封面长标题</h1>
          <p class="lead">[必填] 一句副题。</p>
        </div>
        <div class="v-kicker" style="align-self:center">[必填] 竖排短语</div>
      </div>
      <div class="foot"><div class="mark">[必填] 署名</div><div>21:9 COVER</div></div>
    </div>
  </section>

  <section class="poster square grain" id="wechat-1x1" data-layout="HC10">
    <div class="content" style="align-items:center;text-align:center">
      <div class="stack gap-6" style="margin:auto 0;align-items:center">
        <hr class="rule-amber">
        <h1 class="h-display" style="font-size:116px">[必填] 短标题<br>4-8 字</h1>
      </div>
      <div class="foot" style="align-self:stretch;justify-content:center"><div class="mark">[必填] 署名</div></div>
    </div>
  </section>

  <div class="pair-preview" id="wechat-pair-preview">
    <div class="preview-wide"><div class="preview-label">21:9 main cover</div><div data-clone-of="wechat-21x9"></div></div>
    <div class="preview-square"><div class="preview-label">1:1 square cover</div><div data-clone-of="wechat-1x1"></div></div>
  </div>

  <!-- POSTERS_HERE：按 references/recipes-human-touch.md 的骨架继续加卡 -->

</div>

<script>
/* ==== 图表 + 预览克隆（与 Ready 卡同一 API，主题由 CSS 变量决定） ==== */
(function(){
  function nums(s){return (s||'').split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v))}
  function labs(s){return (s||'').split(',').map(v=>v.trim())}
  function fmtVal(v){return Number.isInteger(v)?String(v):v.toFixed(1)}
  function unitLegend(el,unit){
    const ul=el.dataset.unitLabel||'';
    return `<div class="dc-legend"><span class="dc-dot on"></span>= ${fmtVal(unit)}${ul}</div>`;
  }
  function bar(el){
    const vs=nums(el.dataset.values), ls=labs(el.dataset.labels);
    const unit=parseFloat(el.dataset.unit||1);
    const hot=el.dataset.hot!==undefined?parseInt(el.dataset.hot):-1;
    el.innerHTML=`<div class="dc-bar-wrap">`+vs.map((v,i)=>{
      const n=Math.max(1,Math.round(v/unit));
      let dots='';for(let k=0;k<n;k++)dots+=`<span class="dc-dot ${hot<0||i===hot?'on':'off'}"></span>`;
      return `<div class="dc-bar-col"><div class="dc-val">${fmtVal(v)}</div>
        <div class="dc-bar-dots">${dots}</div><div class="dc-lab">${ls[i]??''}</div></div>`;
    }).join('')+`</div>`+unitLegend(el,unit);
  }
  function hbar(el){
    const vs=nums(el.dataset.values), ls=labs(el.dataset.labels);
    const unit=parseFloat(el.dataset.unit||1);
    const hot=el.dataset.hot!==undefined?parseInt(el.dataset.hot):-1;
    el.innerHTML=vs.map((v,i)=>{
      const n=Math.max(1,Math.round(v/unit));
      let dots='';for(let k=0;k<n;k++)dots+=`<span class="dc-dot ${hot<0||i===hot?'on':'off'}"></span>`;
      return `<div class="dc-hbar-row"><div class="dc-lab" style="text-align:right">${ls[i]??''}</div>
        <div class="dc-hbar-dots">${dots}</div><div class="dc-val">${fmtVal(v)}</div></div>`;
    }).join('')+unitLegend(el,unit);
  }
  function waffle(el){
    const pct=Math.round(parseFloat(el.dataset.percent||0));
    const label=el.dataset.label||'';
    let cells='';
    for(let r=0;r<10;r++)for(let c=0;c<10;c++){
      const idx=(9-r)*10+c;
      cells+=`<span class="dc-dot ${idx<pct?'on':'rest'}"></span>`;
    }
    el.innerHTML=`<div class="dc-waffle">${cells}</div>
      <div class="dc-legend"><span class="dc-val" style="font-size:1.3em">${pct}%</span>　${label}</div>`;
  }
  function line(el){
    const vs=nums(el.dataset.values), ls=labs(el.dataset.labels);
    const w=parseFloat(el.dataset.w||860), h=parseFloat(el.dataset.h||360);
    const dot=parseFloat(el.dataset.dot||16);
    const pad=44, max=Math.max(...vs)*1.18;
    const X=i=>pad+i*(w-2*pad)/(vs.length-1), Y=v=>h-pad-(v/max)*(h-2*pad);
    const pts=vs.map((v,i)=>[X(i),Y(v)]);
    const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const grid=[.33,.66,1].map(f=>`<line class="dc-grid" x1="${pad}" x2="${w-pad}" y1="${Y(max*f).toFixed(1)}" y2="${Y(max*f).toFixed(1)}"/>`).join('');
    el.classList.add('dc-line');
    el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${grid}<path class="dc-path" d="${path}"/>
      ${pts.map((p)=>`<circle class="dc-pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${dot/2}"/>`).join('')}
      <text x="${pts[pts.length-1][0].toFixed(1)}" y="${(pts[pts.length-1][1]-26).toFixed(1)}" text-anchor="middle"
        style="font-size:28px;font-weight:400;fill:var(--ink)">${fmtVal(vs[vs.length-1])}</text>
      ${ls.map((t,i)=>`<text x="${X(i).toFixed(1)}" y="${h-10}" text-anchor="middle" style="font-size:21px;fill:var(--ink-3)">${t}</text>`).join('')}
    </svg>`;
  }
  function renderChart(el){
    const type=el.dataset.type||'bar';
    if(el.dataset.dot) el.style.setProperty('--dc-dot',parseFloat(el.dataset.dot)+'px');
    if(el.dataset.gap) el.style.setProperty('--dc-gap',parseFloat(el.dataset.gap)+'px');
    ({bar,hbar,waffle,line})[type]?.(el);
  }
  function mountPreviews(){
    document.querySelectorAll('[data-clone-of]').forEach(holder=>{
      const src=document.getElementById(holder.dataset.cloneOf);
      if(!src)return;
      const clone=src.cloneNode(true);
      clone.removeAttribute('id');
      holder.style.cssText='overflow:hidden;width:'+src.offsetWidth+'px;height:'+src.offsetHeight+'px';
      holder.appendChild(clone);
    });
  }
  function mountAll(){
    document.querySelectorAll('.dot-chart[data-type]').forEach(renderChart);
    mountPreviews();
  }
  if(document.readyState!=='loading')mountAll();
  else addEventListener('DOMContentLoaded',mountAll,{once:true});
})();
</script>
</body>
</html>
